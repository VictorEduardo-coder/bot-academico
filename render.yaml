services:
  - type: worker
    name: bot-academico
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bot-academico-db
          property: connectionString

databases:
  - name: bot-academico-db
    plan: free
    databaseName: bot_academico
